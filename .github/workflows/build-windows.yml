name: Build Windows Standalone (.EXE)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    paths:
      - 'kodo_core/**'
      - 'core/**'
      - 'launch_app.py'
      - 'server_pos.py'
      - 'Kodo_POS_Windows.spec'
      - '.github/workflows/build-windows.yml'

jobs:
  tests:
    name: 🧪 Tests Python (bloquants)
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt certifi cryptography

      - name: 🧪 Run pytest
        run: python -m pytest -q tests

  build:
    needs: tests
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Checkout Frontend (Kodo-POS-Frontend)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: rulmontkiama/Kodo-POS-Frontend
          ref: main
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          path: _frontend

      - name: ⬢ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🏗️ Build Frontend React
        shell: pwsh
        run: |
          if (Test-Path "_frontend/package.json") {
            Push-Location _frontend
            npm ci
            npm run lint
            npm run test
            npm run build
            Pop-Location
            if (Test-Path "dist") { Remove-Item -Recurse -Force dist }
            Copy-Item -Recurse -Force "_frontend/dist" "dist"
          } elseif (-not (Test-Path "dist/index.html")) {
            Write-Error "Frontend dist/ introuvable : configurez FRONTEND_REPO_TOKEN si Kodo-POS-Frontend est privé."
            exit 1
          }

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt certifi cryptography

      - name: 🏭 Initialize Factory-Clean DB & Icon
        run: |
          python -c "import database_manager; database_manager.DB_NAME='kodo_pos.db'; database_manager.initialiser_db()"
          python -c "from PIL import Image; Image.open('logo.png').save('logo.ico', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"

      - name: 🔨 Compile Standalone Windows Binary with PyInstaller
        run: |
          pyinstaller --clean --noconfirm Kodo_POS_Windows.spec

      - name: 📦 Package Portable Windows Release ZIP
        shell: pwsh
        run: |
          if (Test-Path "dist\Kodo_POS.exe") {
            Compress-Archive -Path dist\Kodo_POS.exe -DestinationPath Kodo_POS_Windows_Standalone.zip -Force
          } elseif (Test-Path "dist\Kodo_POS") {
            Compress-Archive -Path dist\Kodo_POS\* -DestinationPath Kodo_POS_Windows_Standalone.zip -Force
          }
          ls dist

      - name: 🚀 Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kodo_POS_Windows_EXE
          path: |
            dist/Kodo_POS.exe
            Kodo_POS_Windows_Standalone.zip
          retention-days: 30
